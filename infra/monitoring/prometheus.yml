global:
  scrape_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['prometheus:9090']
  - job_name: identity
    metrics_path: /metrics
    static_configs:
      - targets: ['identity:8000']
        labels:
          service: identity
  - job_name: club
    metrics_path: /metrics
    static_configs:
      - targets: ['club:8000']
        labels:
          service: club
  - job_name: booking
    metrics_path: /metrics
    static_configs:
      - targets: ['booking:8000']
        labels:
          service: booking
  - job_name: rabbitmq
    static_configs:
      - targets: ['rabbitmq:15692']
