server {
  listen 80;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  location = /admin { return 301 /admin/; }
  location /admin/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /admin/ { add_header Cache-Control "no-cache"; try_files $uri /admin/index.html; }
  location = /storybook { return 301 /storybook/; }
  location /storybook/ { add_header Cache-Control "no-cache"; try_files $uri $uri/index.html =404; }
  # Хешированные ассеты неизменны; HTML всегда перепроверяется, иначе после пересборки страница ссылается на удалённые чанки.
  location /docs/assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
  location /docs/ { add_header Cache-Control "no-cache"; try_files $uri $uri.html $uri/index.html =404; }
}
