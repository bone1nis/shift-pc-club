events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  # host.docker.internal может сначала разрешиться в недоступный IPv6-адрес, поэтому хосты никогда не помечаем недоступными.
  upstream web_app { server host.docker.internal:3000 max_fails=0; keepalive 64; }
  upstream admin_app { server host.docker.internal:5173 max_fails=0; keepalive 32; }
  upstream docs_app { server host.docker.internal:5175 max_fails=0; }
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  log_format json escape=json '{"time":"$time_iso8601","service":"proxy","level_name":"info","method":"$request_method","status":$status,"duration":$request_time,"request_id":"$request_id"}';
  # В официальном образе nginx access.log — ссылка на stdout. Используем обычный файл, чтобы Alloy
  # читал записи о запросах прокси через том proxylogs.
  access_log /var/log/nginx/shift-access.log json;
  server {
    listen 80;
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_next_upstream error timeout;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location ~ ^/api/(auth|club|booking)/internal/ { return 404; }
    location = /metrics { return 404; }
    location /api/auth/ { set $target http://identity:8000; proxy_pass $target$request_uri; }
    location /api/club/ { set $target http://club:8000; proxy_pass $target$request_uri; }
    location /api/booking/ { set $target http://booking:8000; proxy_pass $target$request_uri; }
    location /admin { proxy_pass http://admin_app; }
    location /docs/ { proxy_pass http://docs_app; }
    # Storybook в разработке открывается напрямую (порт 6006): его WebSocket и ресурсы не работают за префиксом.
    location = /storybook { return 302 http://$host:6006/; }
    location /storybook/ { return 302 http://$host:6006/; }
    location / { proxy_pass http://web_app; }
  }
}
