events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  log_format json escape=json '{"time":"$time_iso8601","service":"proxy","level_name":"info","method":"$request_method","status":$status,"duration":$request_time,"request_id":"$request_id"}';
  # В официальном образе nginx access.log — ссылка на stdout. Используем обычный файл, чтобы Alloy
  # читал записи о запросах прокси через том proxylogs.
  access_log /var/log/nginx/shift-access.log json;
  server {
    listen 80;
    client_max_body_size 5m;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_next_upstream error timeout;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    location ~ ^/api/(auth|club|booking)/internal/ { return 404; }
    location = /metrics { return 404; }
    location /api/auth/ { set $target http://identity:8000; proxy_pass $target$request_uri; }
    location /api/club/ { set $target http://club:8000; proxy_pass $target$request_uri; }
    location /api/booking/ { set $target http://booking:8000; proxy_pass $target$request_uri; }
    location /admin { set $static http://static:80; proxy_pass $static$request_uri; }
    location /storybook/ { set $static http://static:80; proxy_pass $static$request_uri; }
    location /docs/ { set $static http://static:80; proxy_pass $static$request_uri; }
    location = /healthz { access_log off; default_type text/plain; return 200 'ok'; }
    location / { set $web http://web:3000; proxy_pass $web$request_uri; }
  }
}
